<!DOCTYPE html>
<html lang="en">
<head>

      align-items: center;

      padding: 12px;

      max-width: 880px;

      border: 3px solid var(--card-border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px dashed var(--card-border);
      padding-bottom: 14px;
      margin-bottom: 16px;
    }

      font-size: 1.25rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      background: #21262d;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      cursor: pointer;
      font-family: var(--font-stack);
      font-size: 0.82rem;
      font-weight: bold;
      border-radius: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-small:hover {
      background: #30363d;
      border-color: var(--accent-blue);
      color: #ffffff;
    }

    #stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: #0d1117;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
      text-align: center;
    }

    .stat-box {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-value {
      font-weight: bold;
      color: var(--accent-blue);
      font-size: 1rem;
      display: block;
      margin-top: 2px;
    }

    #screen-content {
      min-height: 340px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .prompt-title {
      font-size: 1.15rem;
      color: var(--accent-gold);
      margin-bottom: 12px;
      border-left: 4px solid var(--accent-gold);
      padding-left: 10px;
    }

    .prompt-text {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #e6edf3;
      white-space: pre-line;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid var(--card-border);
      padding: 14px 16px;
      text-align: left;
      font-family: var(--font-stack);
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      line-height: 1.45;
      transition: all 0.15s ease-in-out;
    }

    .option-btn:hover {
      background: #30363d;
      border-color: var(--accent-blue);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

      display: none !important;
    }

      background: var(--card-bg);
      border: 2px solid var(--card-border);

      width: 100%;
      border-radius: 8px;

      margin-bottom: 14px;

      line-height: 1.55;
      margin-bottom: 22px;
      color: #e6edf3;
    }

      margin-bottom: 16px;
      font-weight: bold;
      font-size: 0.95rem;

      color: #ffa198;

      border-radius: 6px;
      padding: 12px;
      font-family: var(--font-stack);
      font-size: 0.82rem;
      margin-bottom: 16px;

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent-green);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      z-index: 2000;
      transition: opacity 0.3s;
    }

      body {
        padding: 6px;
      }

        padding: 14px;
      }
      h1 {

      }
      .option-btn {
        padding: 12px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

    /* ==========================================================================
       2. SAFE LOCALSTORAGE WRAPPER (Prevents blank screens on file:// or strict firewalls)
       ========================================================================== */
    function safeGetStorage(key) {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
      } catch (err) {
        console.warn("localStorage read failed, falling back to memory:", err);
        return null;
      }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (err) {
        console.warn("localStorage write failed:", err);
      }
    }

    const statsBar = document.getElementById('stats-bar');
    const statScore = document.getElementById('stat-score');
    const statMorale = document.getElementById('stat-morale');
    const statSupport = document.getElementById('stat-support');

    const debriefModal = document.getElementById('debrief-modal');
    const debriefHeader = document.getElementById('debrief-header');
    const debriefStatus = document.getElementById('debrief-status');
    const debriefText = document.getElementById('debrief-text');
    const debriefNextBtn = document.getElementById('debrief-next-btn');

    const editorModal = document.getElementById('editor-modal');
    const editorBtn = document.getElementById('editor-btn');
    const jsonEditor = document.getElementById('json-editor');
    const saveJsonBtn = document.getElementById('save-json-btn');
    const copyJsonBtn = document.getElementById('copy-json-btn');
    const resetDefaultBtn = document.getElementById('reset-default-btn');
    const closeEditorBtn = document.getElementById('close-editor-btn');
    const toast = document.getElementById('toast');

    /* ==========================================================================
       4. AUDIO SYNTHESIZER (Pure Web Audio API)
       ========================================================================== */
    function playSound(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.18); // C6
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (e) {}
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    /* ==========================================================================
       5. GAME SCREENS & RENDERING
       ========================================================================== */
    function renderCharacterSelect() {
      statsBar.classList.add('hidden');
      currentPathKey = null;
      currentStageIdx = 0;
      score = 0;
      morale = 100;
      support = 100;

      let html = `
        <div class="prompt-title">SELECT YOUR IMMIGRANT ORIGIN (1830–1939)</div>
        <p class="prompt-text">Choose a historical immigrant group to begin your Oregon Trail-style revision quest through Scottish migration history:</p>
        <div class="options-grid">
      `;

      for (let key in gameData) {
        const path = gameData[key];
        html += `
          <button class="option-btn" onclick="startPath('${key}')">
            <strong style="color:var(--accent-gold); font-size:1rem;">${path.title}</strong><br>
            <span style="font-size:0.83rem; color:var(--text-muted); display:block; margin-top:4px;">${path.description}</span>
          </button>
        `;
      }

      html += `</div>`;
      screenContent.innerHTML = html;
    }

    function startPath(key) {
      currentPathKey = key;
      currentStageIdx = 0;
      statsBar.classList.remove('hidden');
      updateStatsUI();
      renderStage();
    }

    function updateStatsUI() {
      statScore.textContent = score;
      statMorale.textContent = morale + "%";
      statSupport.textContent = support + "%";
    }

    function renderStage() {
      const path = gameData[currentPathKey];
      if (!path || !path.stages || currentStageIdx >= path.stages.length) {
        renderVictory();
        return;
      }

      const stage = path.stages[currentStageIdx];
      let html = `
        <div class="prompt-title">${stage.title}</div>
        <p class="prompt-text">${stage.prompt}</p>
        <div class="options-grid">
      `;

      stage.options.forEach((opt, idx) => {
        html += `
          <button class="option-btn" onclick="makeChoice(${idx})">
            ${opt.text}
          </button>
        `;
      });

      html += `</div>`;
      screenContent.innerHTML = html;
    }

    function makeChoice(optIdx) {
      const stage = gameData[currentPathKey].stages[currentStageIdx];
      const selected = stage.options[optIdx];

      if (selected.correct) {
        playSound('correct');
        score += 100;
        debriefHeader.textContent = "HISTORICAL ANALYSIS: ACCURATE";
        debriefHeader.style.color = "var(--accent-green)";
        debriefStatus.className = "debrief-box debrief-correct";
        debriefStatus.textContent = "✔ Correct Historical Choice (+100 Points)";
      } else {
        playSound('wrong');
        morale = Math.max(0, morale - 20);
        support = Math.max(0, support - 15);
        debriefHeader.textContent = "HISTORICAL ANALYSIS: MISCONCEPTION";
        debriefHeader.style.color = "var(--accent-red)";
        debriefStatus.className = "debrief-box debrief-incorrect";
        debriefStatus.textContent = "✖ Historical Error (-20% Morale, -15% Support)";
      }

      updateStatsUI();
      debriefText.textContent = selected.feedback;
      debriefModal.classList.remove('hidden');
    }

    debriefNextBtn.addEventListener('click', () => {
      debriefModal.classList.add('hidden');
      if (morale <= 0) {
        renderGameOver();
      } else {
        currentStageIdx++;
        renderStage();
      }
    });

    function renderVictory() {
      statsBar.classList.remove('hidden');
      let html = `
        <div class="prompt-title" style="color:var(--accent-green); border-left-color:var(--accent-green);">QUEST COMPLETE!</div>
        <p class="prompt-text">
          Congratulations! You have successfully completed the <strong>${gameData[currentPathKey].title}</strong>.<br><br>
          <strong>Final Revision Score:</strong> ${score} Points<br>
          <strong>Ending Morale:</strong> ${morale}%<br>
          <strong>Community Support:</strong> ${support}%
        </p>
        <button class="option-btn" onclick="renderCharacterSelect()" style="text-align:center; font-weight:bold; background:var(--accent-green); color:#ffffff; border-color:var(--accent-green-hover);">
          🔄 RESTART / PLAY ANOTHER IMMIGRANT PATH
        </button>
      `;
      screenContent.innerHTML = html;
    }

    function renderGameOver() {
      statsBar.classList.remove('hidden');
      let html = `
        <div class="prompt-title" style="color:var(--accent-red); border-left-color:var(--accent-red);">QUEST FAILED</div>
        <p class="prompt-text">
          Your community morale dropped to 0% due to severe historical misconceptions.<br><br>
          <strong>Final Score:</strong> ${score} Points
        </p>
        <button class="option-btn" onclick="renderCharacterSelect()" style="text-align:center; font-weight:bold; background:var(--accent-red); color:#ffffff;">
          🔄 TRY AGAIN
        </button>
      `;
      screenContent.innerHTML = html;
    }

    /* ==========================================================================
       6. TEACHER QUESTION SUITE EDITOR
       ========================================================================== */
    editorBtn.addEventListener('click', () => {
      jsonEditor.value = JSON.stringify(gameData, null, 2);
      editorModal.classList.remove('hidden');
    });

    closeEditorBtn.addEventListener('click', () => {
      editorModal.classList.add('hidden');
    });

    saveJsonBtn.addEventListener('click', () => {
      try {
        const updated = JSON.parse(jsonEditor.value);
        gameData = updated;
        safeSetStorage('scotland_quest_data', gameData);
        editorModal.classList.add('hidden');
        showToast("Question Suite Saved!");
        renderCharacterSelect();
      } catch (err) {
        alert("Invalid JSON format. Please check your syntax.");
      }
    });

    resetDefaultBtn.addEventListener('click', () => {
      gameData = DEFAULT_GAME_DATA;
      safeSetStorage('scotland_quest_data', gameData);
      jsonEditor.value = JSON.stringify(DEFAULT_GAME_DATA, null, 2);
      showToast("Restored to Default SQA Booklet Data");
    });

    copyJsonBtn.addEventListener('click', () => {
      try {
        navigator.clipboard.writeText(jsonEditor.value);
        showToast("JSON Copied to Clipboard!");
      } catch (e) {
        jsonEditor.select();
        document.execCommand('copy');
        showToast("JSON Copied!");
      }
    });

    /* ==========================================================================
       7. TRIPLE-FAIL-SAFE APP INITIALIZATION
       ========================================================================== */
    function initApp() {
      try {
        renderCharacterSelect();
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      initApp();
    } else {
      document.addEventListener('DOMContentLoaded', initApp);
    }
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
